name: Record CMC Trending

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'  # every 6h at 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:               # manual trigger for testing

jobs:
  record:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Run recorder
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
        run: npm run record

      - name: Backfill outcomes
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
        run: npm run outcomes

      - name: Export JSON for web
        run: npm run export-json

      - name: Commit snapshot
        run: |
          git config user.name "wick-recorder"
          git config user.email "recorder@wick"
          git add data/wick.db web/public/data/
          git diff --staged --quiet || git commit -m "snapshot: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
